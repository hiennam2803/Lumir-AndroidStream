[package]
name = "lumir"
version = "1.0.0"
authors = ["ĐT Văn Hiền <vhdt283@gmail.com>"]
description = "LUMIR — Android Device Manager"
edition = "2021"

[lib]
name = "lumir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Mock runtime để test command Tauri qua IPC (chỉ khi `cargo test`, không vào bản build).
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
